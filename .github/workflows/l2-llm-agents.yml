# Experiment L2 (language-model agents) run remotely on GitHub Actions.
# Protocol: notes/claude_audit_20261005/studies/L2_llm_agents/protocol.md (Amendments 1-2), on branch
# claude/r1-s1-oversight-experiments. Results are committed to the l2-results branch every 20 minutes and after every job.
# Stage em (Amendment 5) runs the corrected memory cell into claude_l2_em_v2.
# Amendment 2 (Ollama Pro allows 3 cloud models at a time): three lanes A, B, C run in parallel; which models each lane
# runs is set in scripts/l2_ci_step.sh. Each lane's job starts that lane's next job when it stops (after a 45-minute
# wait at the usage limit); the hourly schedule is only a backup.
# Needs the Ollama API key as repository secret OLLAMA_API_KEY (or SCALABLE_OVERSIGHT). Modes: check (one tiny call per model), run.
name: L2 LLM agents (remote run)

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check | run"
        required: true
        default: "check"
      lane:
        description: "all | A | B | C"
        required: true
        default: "all"
      stage:
        description: "main (10 cells) | em (the memory cell, Amendment 5)"
        required: false
        default: "main"

permissions:
  contents: write
  actions: write

jobs:
  l2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(((inputs.mode || 'run') == 'check' && '["A"]') || ((inputs.lane || 'all') == 'all' && '["A","B","C"]') || format('["{0}"]', inputs.lane)) }}
    concurrency:
      group: l2-lane-${{ inputs.stage || 'main' }}-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      OLLAMA_HOST: https://ollama.com
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY || secrets.SCALABLE_OVERSIGHT }}
      MODE: ${{ inputs.mode || 'run' }}
      LANE: ${{ matrix.lane }}
      STAGE: ${{ inputs.stage || 'main' }}
      CODE_REF: claude/r1-s1-oversight-experiments
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Check out the results branch into ./store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" l2-results >/dev/null; then
            git clone --quiet --branch l2-results --single-branch "$url" store
          else
            mkdir store && git -C store init -q -b l2-results && git -C store remote add origin "$url"
          fi
      - name: Run one chunk of L2 (lane ${{ matrix.lane }})
        run: bash scripts/l2_ci_step.sh "$MODE" store 330 "$LANE" "$STAGE"
      - name: Commit progress to l2-results
        if: always()
        run: bash scripts/l2_save.sh store "L2 progress ($STAGE, lane $LANE)"
      - name: Start this lane's next job
        if: success() && env.MODE == 'run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=$(cat NEXT 2>/dev/null || echo none)
          echo "next: $next"
          if [ "$next" = "wait" ]; then echo "usage limit: waiting 45 minutes"; sleep 2700; fi
          if [ "$next" = "wait" ] || [ "$next" = "now" ]; then gh workflow run l2-llm-agents.yml --ref main -f mode=run -f lane="$LANE" -f stage="$STAGE"; fi
